<!DOCTYPE html>
<html lang="zh-Hant" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaka 之島｜Avaka</title>
<meta name="description" content="《Avaka：島嶼的維度》的 3D 蘭嶼島：山林、灘頭工作室、商店，一年的工序在哪裡發生。">
<meta name="theme-color" content="#f6f1e4">
<script>
  (function () {
    var q = new URLSearchParams(location.search), l = null;
    try { l = localStorage.getItem('avaka_lang'); } catch (e) {}
    var en = (q.get('lang') || l) === 'en';
    document.documentElement.dataset.lang = en ? 'en' : 'zh';
    document.documentElement.lang = en ? 'en' : 'zh-Hant';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/island/island.css?v=20261023_51">
<script type="importmap">{ "imports": { "three": "/vendor/three-r160/three.module.min.js", "three/addons/": "/vendor/three-r160/addons/" } }</script>
</head>
<body>
<main id="app">
  <div id="stage"></div>

  <header class="brand">
    <a class="mark" href="/rules" aria-label="Avaka">Avaka</a>
    <div>
      <h1 id="title">Avaka 之島</h1>
      <p id="subtitle">一座島，三個地方，一年的工序</p>
    </div>
  </header>

  <nav class="tools" aria-label="操作">
    <button type="button" id="home" class="tool"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l8-7 8 7M6 10v9h12v-9"/></svg><span>全景</span></button>
    <button type="button" id="t-names" class="tool tog" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4"/></svg><span>名牌</span></button>
    <button type="button" id="t-people" class="tool tog" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3"/><path d="M6 20c0-4 3-7 6-7s6 3 6 7"/></svg><span>行人</span></button>
    <button type="button" id="t-bird" class="tool tog" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-7 9 7-9 7z"/></svg><span>鳥瞰</span></button>
    <button type="button" id="t-help" class="tool" aria-label="操作說明">?</button>
    <button type="button" id="lang" class="tool">EN</button>
    <a id="back" class="tool" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>回到遊戲</span></a>
  </nav>

  <section class="calendar" aria-label="十二個月">
    <nav id="months" class="months"></nav>
    <div id="month-info" class="month-info" aria-live="polite"></div>
    <p id="month-note" class="month-note"></p>
  </section>

  <aside class="side" aria-labelledby="list-title">
    <h2 id="list-title">島上的地方</h2>
    <ol id="list" class="list"></ol>
    <h2 id="vlist-title" class="sub">六個部落</h2>
    <ul id="vlist" class="list villages"></ul>
    <p id="map-note" class="note"></p>
  </aside>

  <article id="card" class="card" hidden aria-labelledby="card-title">
    <button type="button" id="card-close" class="close" aria-label="關閉">×</button>
    <div id="card-body"></div>
  </article>

  <p id="hint" class="hint" aria-hidden="true"></p>

  <div id="intro" class="intro" hidden>
    <div class="intro-box" role="dialog" aria-modal="true" aria-labelledby="intro-title">
      <p class="eyebrow" id="intro-count">1 / 3</p>
      <h2 id="intro-title"></h2>
      <p id="intro-body"></p>
      <div class="intro-actions"><button type="button" id="intro-skip"></button><button type="button" id="intro-next" class="next"></button></div>
    </div>
  </div>

  <div id="loading" class="loading" role="status">
    <svg class="cord" viewBox="0 0 120 14" aria-hidden="true"><path d="M2 7C16 1 26 13 40 7S64 1 78 7 104 13 118 7"/><path d="M2 7C16 13 26 1 40 7S64 13 78 7 104 1 118 7"/></svg>
    <p><span lang="zh-Hant">正在把島嶼拼起來…</span><span lang="en">Putting the island together…</span></p>
  </div>
</main>
<script type="module" src="/island/island.js?v=20261023_51"></script>
</body>
</html>
